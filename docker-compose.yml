# Despliegue de Dockyard en la PC del docente. Se levanta con ./install.sh, que genera .env.
name: dockyard

services:
  app:
    build: .
    restart: unless-stopped
    # Corre con el usuario que instaló, para que projects/ y data/ queden a su nombre.
    # El grupo del socket le da permiso de usar Docker. Los tres valores los escribe install.sh.
    user: "${HOST_UID:-0}:${HOST_GID:-0}"
    group_add:
      - "${DOCKER_GID:-0}"
    ports:
      # Solo esta PC: quien alcance la herramienta puede ejecutar proyectos con el Docker del anfitrión.
      - "127.0.0.1:${TOOL_PORT:-4300}:${TOOL_PORT:-4300}"
    environment:
      PORT: ${TOOL_PORT:-4300}
      # Dentro del contenedor debe escuchar en todas sus interfaces; el límite lo pone "ports".
      HOST: 0.0.0.0
      PROJECTS_DIR: ${PROJECTS_DIR:?Falta PROJECTS_DIR en .env. Ejecuta ./install.sh}
      DATA_DIR: /app/data
      # El usuario no existe dentro de la imagen; npm, git y docker necesitan un HOME con escritura.
      HOME: /tmp
      # Para comprobar que la web de cada proyecto responde: aquí dentro, localhost es Dockyard.
      PROJECTS_HOST: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:$$PORT/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      # La herramienta controla el Docker del anfitrión; los proyectos son contenedores hermanos.
      - /var/run/docker.sock:/var/run/docker.sock
      # Regla crítica: la misma ruta dentro y fuera. El Docker del anfitrión resuelve los montajes
      # relativos de los proyectos (./src:/app) con la ruta que ve la herramienta.
      - ${PROJECTS_DIR}:${PROJECTS_DIR}
      - ./data:/app/data
